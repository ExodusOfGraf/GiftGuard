name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: giftguard
          POSTGRES_USER: giftguard
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U giftguard -d giftguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_SECRET: ci-only-secret-at-least-16-chars
      DATABASE_URL: postgresql+asyncpg://giftguard:ci-only-password@localhost:5432/giftguard
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff
      - run: ruff check backend tests
      - run: ruff format --check backend tests
      - run: pytest -q
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head && alembic current

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Build application images
        run: docker compose build backend frontend
      - name: Validate staging Compose configuration
        run: cp .env.example deploy/.env && GIFTGUARD_TAG=ci docker compose -f deploy/compose.yml config --quiet
