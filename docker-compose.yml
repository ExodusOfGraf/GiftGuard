services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giftguard}
      POSTGRES_USER: ${POSTGRES_USER:-giftguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giftguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giftguard} -d ${POSTGRES_DB:-giftguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    ports:
      - "6379:6379"

  backend:
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && python run_api.py"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build: .
    env_file: .env
    command: python run_bot.py
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    command: arq app.worker.WorkerSettings
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
